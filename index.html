<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12263b"><title>Flight Computer TEST</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0c1928;color:#eaf4ff;margin:0;padding:18px}main{max-width:650px;margin:auto}h1{font-size:24px;margin:12px 0 4px}small,.sub{color:#9fb7cc}.card{background:#172b41;border:1px solid #34506b;border-radius:16px;padding:18px;margin:16px 0}h2{font-size:19px;margin-top:0}label{display:block;margin:12px 0;color:#c8d8e8}input{box-sizing:border-box;width:100%;background:#081727;border:1px solid #607e99;border-radius:9px;padding:12px;color:white;font-size:20px;margin-top:6px}.result{background:#0c2335;border-radius:10px;padding:13px;line-height:1.9;font-size:18px}strong{color:#85e4d1}.warn{font-size:13px;color:#f4ce83;line-height:1.5}footer{font-size:12px;color:#9fb7cc}</style></head><body><main><h1>✈ Flight Computer</h1><div class="sub">iPad Safari 動作確認用 · TEST v0.1</div><div class="card"><h2>🌬 横風・向かい風成分</h2><label>滑走路方位（度）<input id="rwy" type="number" value="070" min="0" max="360"></label><label>風向（度・真/磁方位をRWYと統一）<input id="wd" type="number" value="120" min="0" max="360"></label><label>風速（kt）<input id="ws" type="number" value="20" min="0"></label><div id="wind" class="result"></div></div><div class="card"><h2>📐 3°降下パス</h2><label>滑走路THRからの距離（NM）<input id="dist" type="number" value="6" step="0.1" min="0"></label><label>進入角（度）<input id="angle" type="number" value="3" step="0.1" min="0.1" max="10"></label><label>THR通過高度（ft、THR基準）<input id="tch" type="number" value="50"></label><label>対地速度（kt）<input id="gs" type="number" value="140" min="1"></label><div id="path" class="result"></div></div><p class="warn">⚠️ 技術検証用の試作です。実運航、飛行計画、最低高度判定には使用しないでください。3°計算は単純な幾何モデルで、地形・障害物・気温補正・実際の進入方式を考慮していません。</p><footer>HTML単体版：通信不要の計算テスト。PWAのホーム画面追加・キャッシュ検証はHTTPS公開後に実施。</footer></main><script>const ids=['rwy','wd','ws','dist','angle','tch','gs'];const v=id=>Number(document.getElementById(id).value);function calc(){let d=(v('wd')-v('rwy'))*Math.PI/180,head=v('ws')*Math.cos(d),cross=v('ws')*Math.sin(d);document.getElementById('wind').innerHTML=`向かい風成分：<strong>${head>=0?'向かい風':'追い風'} ${Math.abs(head).toFixed(1)} kt</strong><br>横風成分：<strong>${Math.abs(cross)<.05?'ほぼなし':(cross>0?'右から':'左から')} ${Math.abs(cross).toFixed(1)} kt</strong>`;let fpnm=6076.11549*Math.tan(v('angle')*Math.PI/180),alt=v('tch')+v('dist')*fpnm,vs=v('gs')*fpnm/60;document.getElementById('path').innerHTML=`THR基準高度：<strong>${alt.toFixed(0)} ft</strong><br>降下勾配：<strong>${fpnm.toFixed(0)} ft/NM</strong><br>必要降下率：<strong>${vs.toFixed(0)} ft/min</strong>`}ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();</script></body></html>
